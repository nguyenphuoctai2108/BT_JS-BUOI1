<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập JS</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Bài tập 1 -->
    <h3>BT1 - Tính tiền lương nhân viên</h3>
    <input id="LuongNgay" type="number" placeholder="Lương/ ngày" />
    <input id="NgayLam" type="number" placeholder="Ngày làm" />
    <button id="btnTongTienLuong">Tổng tiền lương</button>
    <p id="pInfo_1"></p>

    <!-- Bài tập 2 -->
    <h3>BT2 - Tính giá trị trung bình</h3>
    <input id="number_1" type="number" placeholder="Number" />
    <input id="number_2" type="number" placeholder="Number" />
    <input id="number_3" type="number" placeholder="Number" />
    <input id="number_4" type="number" placeholder="Number" />
    <input id="number_5" type="number" placeholder="Number" />
    <button id="btnTotalTrungBinh">Tổng trung bình</button>
    <p id="pInfo_2"></p>

    <!-- Bài tập 3 -->
    <h3>BT3 - Quy đổi tiền</h3>
    <input id="USD" type="number" placeholder="USD" />
    <button id="btnQuyDoi">Quy đổi</button>
    <p id="pInfo_3"></p>

    <!-- Bài tập 4 -->
    <h3>BT4 - Diện tích, chu vi HCN</h3>
    <input id="CD" type="number" placeholder="Chiều dài" />
    <input id="CR" type="number" placeholder="Chiều rộng" />
    <button id="btnKQ">Kết quả</button>
    <p id="pInfo_4"></p>
    <p id="pInfo_4_1"></p>

    <!-- Bài tập 5 -->
    <h3>BT5 - Tính tổng 2 kí số</h3>
    <input id="number_n" type="number" placeholder="Nhập số có 2 chữ số" />
    <button id="btnTongKySo">Tổng kí số</button>
    <p id="pInfo_5"></p>

    <!-- SCRIPT -->
    <!-- SCRIPT BÀI TẬP 1 -->
    <script src="./js/bt1.js"></script>

</html>
